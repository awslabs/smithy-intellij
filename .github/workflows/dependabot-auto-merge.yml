name: dependabot-auto-merge

# dependabot.yml cannot merge its own pull requests, so auto-merge is enabled
# here instead. GitHub then merges each PR as soon as every gate configured on
# main is satisfied. Adding the ci matrix jobs as required status checks on main
# is what makes a green build one of those gates.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'awslabs/smithy-intellij'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors can break the plugin against the supported IDE builds, so they
      # stay manual; minor and patch bumps queue themselves for merge.
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
